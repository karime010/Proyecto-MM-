{% extends "base.html" %}
{% block contenido %}

<div class="container mt-5"  >

    <form method="POST">

        <h1>Nueva contraseña</h1>

        <input type="password" name="password" class="form-control mb-3" placeholder="Nueva contraseña" required>

        <input type="password" name="confirmPassword" class="form-control mb-3" placeholder="Confirmar contraseña" required>

        <button type="submit" class="btn btn-primary">Cambiar contraseña </button>
    </form>

</div>

{% endblock %}

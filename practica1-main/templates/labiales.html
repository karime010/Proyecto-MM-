{% extends "base.html" %}
{% block contenido %}

<div class="container mt-4">

    <div style="display:flex; flex-wrap:wrap; gap:15px; justify-content:center;">

        {% for labial in labiales %}

        <div class="card" style="width: 18rem;">
            <img src="{{ url_for('static', filename=labial.imagen) }}" class="card-img-top">

            <div class="card-body">
                <h5>{{ labial.nombre }}</h5>
                <p>{{ labial.descripcion }}</p>
                <p><strong>${{ labial.precio }}</strong></p>
            </div>
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
